name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: meta
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG=${MSG%%$'\n'*}
          TAG=${TAG%% *}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: |
          git tag "${{ steps.meta.outputs.tag }}" || true
          git push origin "${{ steps.meta.outputs.tag }}" || true

  pypi:
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  npm:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: |
          VER="${{ needs.tag.outputs.version }}"
          curl -sf "https://registry.npmjs.org/@marleena/trb-proto/${VER}" >/dev/null \
            || npm publish --access public

  go:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG="${{ needs.tag.outputs.tag }}"
          curl -fsSL "https://proxy.golang.org/github.com/!mar1eena/trb_proto/@v/${TAG}.info"
          curl -sS -X POST --max-time 60 \
            -H "Origin: https://pkg.go.dev" \
            -H "Referer: https://pkg.go.dev/github.com/Mar1eena/trb_proto@${TAG}" \
            "https://pkg.go.dev/fetch/github.com/Mar1eena/trb_proto@${TAG}"

  github-release:
    needs: [tag, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: dist/*
          generate_release_notes: true
