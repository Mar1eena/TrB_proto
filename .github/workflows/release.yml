name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trb-proto
    env:
      TAG: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: |
          TAG=${TAG%%$'\n'*}
          TAG=${TAG%% *}
          git tag "$TAG" || true
          git push origin "$TAG" || true
          VER=$(node -p "require('./package.json').version")
          curl -sf "https://registry.npmjs.org/@marleena/trb-proto/${VER}" >/dev/null \
            || npm publish --access public
          curl -fsSL "https://proxy.golang.org/github.com/!mar1eena/trb_proto/@v/${TAG}.info"
          curl -sS -X POST --max-time 60 \
            -H "Origin: https://pkg.go.dev" \
            -H "Referer: https://pkg.go.dev/github.com/Mar1eena/trb_proto@${TAG}" \
            "https://pkg.go.dev/fetch/github.com/Mar1eena/trb_proto@${TAG}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist
      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
