name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODULE: github.com/Mar1eena/trb_proto
    steps:
      - id: parse
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG="${COMMIT_MSG%%$'\n'*}"
          MSG="${MSG%%[[:space:]]*}"
          if [[ "$MSG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=$MSG" >> "$GITHUB_OUTPUT"
          else
            echo "Not a version commit, skip"
          fi

      - if: steps.parse.outputs.tag != ''
        uses: actions/checkout@v4

      - if: steps.parse.outputs.tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - if: steps.parse.outputs.tag != ''
        name: Publish npm
        env:
          TAG: ${{ steps.parse.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          case "$PKG" in
            "$TAG"|"${TAG#v}") ;;
            *)
              echo "package.json version ($PKG) does not match commit $TAG"
              exit 1
              ;;
          esac
          npm publish --access public

      - if: steps.parse.outputs.tag != ''
        name: Update pkg.go.dev
        env:
          TAG: ${{ steps.parse.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}"; then
            git tag -a "${TAG}" -m "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          URL="https://proxy.golang.org/${MODULE}/@v/${TAG}.info"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$URL"; then
              echo "https://pkg.go.dev/${MODULE}@${TAG}"
              exit 0
            fi
            echo "proxy not ready yet (attempt ${i}), waiting..."
            sleep 15
          done
          echo "Could not fetch ${URL}"
          exit 1
