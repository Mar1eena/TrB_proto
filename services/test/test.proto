syntax = "proto3";

package trb.test.v1;

option go_package = "github.com/Mar1eena/trb_proto/gen/go/test;test";

import "google/api/annotations.proto";
import "clickhouse/clickhouse.proto";

// Test — оркестратор: клиент invest и ClickHouse. Сам к брокеру и БД не ходит.
service Test {
  // SyncInstruments запрашивает акции у invest и вызывает ClickHouse.UpsertInstruments.
  rpc SyncInstruments(SyncInstrumentsRequest) returns (SyncInstrumentsResponse) {
    option (google.api.http) = {
      post: "/v1/test/instruments/sync"
      body: "*"
      additional_bindings { post: "/SyncInstruments" body: "*" }
    };
  }
}

message SyncInstrumentsRequest {}

message SyncInstrumentsResponse {
  trb.clickhouse.v1.UpsertInstrumentsResponse upsert = 1;
}
