syntax = "proto3";

package trb.clickhouse.manager.public.contract.v1;

option go_package = "github.com/Mar1eena/trb_proto/gen/go/clickhouse_manager;clickhouse_manager";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// ClickHouseManager — типизированное управление схемой, мониторинг и выполнение запросов к ClickHouse.
service ClickHouseManager {
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = {
      get: "/v1/clickhouse/ping"
      additional_bindings { post: "/Ping" body: "*" }
    };
  }

  rpc ServerInfo(ServerInfoRequest) returns (ServerInfoResponse) {
    option (google.api.http) = {
      get: "/v1/clickhouse/info"
      additional_bindings { post: "/ServerInfo" body: "*" }
    };
  }

  rpc CreateDatabase(DatabaseSpec) returns (Status) {
    option (google.api.http) = {
      post: "/v1/clickhouse/databases"
      body: "*"
      additional_bindings { post: "/CreateDatabase" body: "*" }
    };
  }

  rpc DropDatabase(DatabaseName) returns (Status) {
    option (google.api.http) = {
      delete: "/v1/clickhouse/databases/{name}"
      additional_bindings { post: "/DropDatabase" body: "*" }
    };
  }

  rpc ListDatabases(ListDatabasesRequest) returns (DatabaseList) {
    option (google.api.http) = {
      get: "/v1/clickhouse/databases"
      additional_bindings { post: "/ListDatabases" body: "*" }
    };
  }

  rpc DatabaseInfo(DatabaseName) returns (Database) {
    option (google.api.http) = {
      get: "/v1/clickhouse/databases/{name}"
      additional_bindings { post: "/DatabaseInfo" body: "*" }
    };
  }

  rpc CreateTable(TableSpec) returns (Status) {
    option (google.api.http) = {
      post: "/v1/clickhouse/databases/{database}/tables"
      body: "*"
      additional_bindings { post: "/CreateTable" body: "*" }
    };
  }

  rpc DropTable(TableName) returns (Status) {
    option (google.api.http) = {
      delete: "/v1/clickhouse/databases/{database}/tables/{name}"
      additional_bindings { post: "/DropTable" body: "*" }
    };
  }

  rpc TruncateTable(TableName) returns (Status) {
    option (google.api.http) = {
      post: "/v1/clickhouse/databases/{database}/tables/{name}:truncate"
      additional_bindings { post: "/TruncateTable" body: "*" }
    };
  }

  rpc RenameTable(RenameTableRequest) returns (Status) {
    option (google.api.http) = {
      post: "/v1/clickhouse/databases/{database}/tables/{name}:rename"
      body: "*"
      additional_bindings { post: "/RenameTable" body: "*" }
    };
  }

  rpc OptimizeTable(OptimizeTableRequest) returns (Status) {
    option (google.api.http) = {
      post: "/v1/clickhouse/databases/{database}/tables/{name}:optimize"
      body: "*"
      additional_bindings { post: "/OptimizeTable" body: "*" }
    };
  }

  rpc ListTables(ListTablesRequest) returns (TableList) {
    option (google.api.http) = {
      get: "/v1/clickhouse/databases/{database}/tables"
      additional_bindings { post: "/ListTables" body: "*" }
    };
  }

  rpc TableInfo(TableName) returns (Table) {
    option (google.api.http) = {
      get: "/v1/clickhouse/databases/{database}/tables/{name}"
      additional_bindings { post: "/TableInfo" body: "*" }
    };
  }

  rpc AddColumn(AddColumnRequest) returns (Status) {
    option (google.api.http) = {
      post: "/v1/clickhouse/databases/{database}/tables/{table}/columns"
      body: "*"
      additional_bindings { post: "/AddColumn" body: "*" }
    };
  }

  rpc DropColumn(DropColumnRequest) returns (Status) {
    option (google.api.http) = {
      delete: "/v1/clickhouse/databases/{database}/tables/{table}/columns/{name}"
      additional_bindings { post: "/DropColumn" body: "*" }
    };
  }

  rpc RenameColumn(RenameColumnRequest) returns (Status) {
    option (google.api.http) = {
      post: "/v1/clickhouse/databases/{database}/tables/{table}/columns/{name}:rename"
      body: "*"
      additional_bindings { post: "/RenameColumn" body: "*" }
    };
  }

  rpc ModifyColumn(ModifyColumnRequest) returns (Status) {
    option (google.api.http) = {
      put: "/v1/clickhouse/databases/{database}/tables/{table}/columns/{column.name}"
      body: "*"
      additional_bindings { post: "/ModifyColumn" body: "*" }
    };
  }

  rpc ExecuteQuery(ExecuteQueryRequest) returns (ExecuteQueryResponse) {
    option (google.api.http) = {
      post: "/v1/clickhouse/query"
      body: "*"
      additional_bindings { post: "/ExecuteQuery" body: "*" }
    };
  }

  rpc PreviewTableData(PreviewTableDataRequest) returns (ExecuteQueryResponse) {
    option (google.api.http) = {
      post: "/v1/clickhouse/databases/{database}/tables/{table}:preview"
      body: "*"
      additional_bindings { post: "/PreviewTableData" body: "*" }
    };
  }

  rpc ListParts(ListPartsRequest) returns (PartsList) {
    option (google.api.http) = {
      get: "/v1/clickhouse/databases/{database}/tables/{table}/parts"
      additional_bindings { post: "/ListParts" body: "*" }
    };
  }

  rpc DropPartition(DropPartitionRequest) returns (Status) {
    option (google.api.http) = {
      post: "/v1/clickhouse/databases/{database}/tables/{table}/partitions:drop"
      body: "*"
      additional_bindings { post: "/DropPartition" body: "*" }
    };
  }

  rpc ListProcesses(ListProcessesRequest) returns (ProcessList) {
    option (google.api.http) = {
      get: "/v1/clickhouse/processes"
      additional_bindings { post: "/ListProcesses" body: "*" }
    };
  }

  rpc KillProcess(KillProcessRequest) returns (Status) {
    option (google.api.http) = {
      post: "/v1/clickhouse/processes:kill"
      body: "*"
      additional_bindings { post: "/KillProcess" body: "*" }
    };
  }

  rpc ListDisks(ListDisksRequest) returns (DiskList) {
    option (google.api.http) = {
      get: "/v1/clickhouse/disks"
      additional_bindings { post: "/ListDisks" body: "*" }
    };
  }

  rpc GetMetrics(GetMetricsRequest) returns (MetricsResponse) {
    option (google.api.http) = {
      get: "/v1/clickhouse/metrics"
      additional_bindings { post: "/GetMetrics" body: "*" }
    };
  }

  rpc GetTableOptions(TableOptionsRequest) returns (TableOptionsResponse) {
    option (google.api.http) = {
      get: "/v1/clickhouse/table_options"
      additional_bindings { post: "/GetTableOptions" body: "*" }
    };
  }
}

message Status {
  bool success = 1;
  string message = 2;
}

message PingRequest {}

message PingResponse {
  bool ok = 1;
  string version = 2;
}

message ServerInfoRequest {}

message ServerInfoResponse {
  string version = 1;
  string display_name = 2;
  uint32 revision = 3;
  string timezone = 4;
  uint32 uptime_seconds = 5;
}

message DatabaseSpec {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string engine = 2; // Atomic, Lazy, Memory, …
  string comment = 3;
  bool if_not_exists = 4;
  string cluster = 5; // ON CLUSTER
}

message DatabaseName {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  bool if_exists = 2;
  bool sync = 3;
  string cluster = 4;
}

message ListDatabasesRequest {
  string like = 1;
}

message Database {
  string name = 1;
  string engine = 2;
  string comment = 3;
  uint64 tables_count = 4;
  uint64 total_bytes = 5;
  uint64 total_rows = 6;
}

message DatabaseList {
  repeated Database items = 1;
}

message Column {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
  string type = 2 [(google.api.field_behavior) = REQUIRED]; // DateTime, String, Float64, …
  string default_kind = 3; // DEFAULT, MATERIALIZED, ALIAS, EPHEMERAL
  string default_expression = 4;
  string codec = 5;
  string ttl = 6;
  string comment = 7;
}

message TableEngine {
  string name = 1; // MergeTree, ReplacingMergeTree, AggregatingMergeTree, …
  repeated string params = 2;
}

message TableSpec {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  repeated Column columns = 3;
  TableEngine engine = 4;
  string order_by = 5;
  string partition_by = 6;
  string primary_key = 7;
  string sample_by = 8;
  string ttl = 9;
  map<string, string> settings = 10;
  string comment = 11;
  bool if_not_exists = 12;
  string cluster = 13;
}

message TableName {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  bool if_exists = 3;
  bool sync = 4;
  string cluster = 5;
}

message ListTablesRequest {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string like = 2;
}

message Table {
  string database = 1;
  string name = 2;
  string engine = 3;
  uint64 total_rows = 4;
  uint64 total_bytes = 5;
  string partition_key = 6;
  string sorting_key = 7;
  string primary_key = 8;
  string comment = 9;
  string create_table_query = 10;
  google.protobuf.Timestamp metadata_modification_time = 11;
  repeated Column columns = 12;
  uint64 parts_count = 13;
  uint64 data_uncompressed_bytes = 14;
}

message TableList {
  repeated Table items = 1;
}

message RenameTableRequest {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string new_database = 3;
  string new_name = 4 [(google.api.field_behavior) = REQUIRED];
  string cluster = 5;
}

message OptimizeTableRequest {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string name = 2 [(google.api.field_behavior) = REQUIRED];
  string partition = 3;
  bool final = 4;
  bool deduplicate = 5;
  string cluster = 6;
}

message AddColumnRequest {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string table = 2 [(google.api.field_behavior) = REQUIRED];
  Column column = 3 [(google.api.field_behavior) = REQUIRED];
  string after = 4; // AFTER col; пусто — в конец, FIRST — в начало
  bool if_not_exists = 5;
  string cluster = 6;
}

message DropColumnRequest {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string table = 2 [(google.api.field_behavior) = REQUIRED];
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  bool if_exists = 4;
  string cluster = 5;
}

message RenameColumnRequest {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string table = 2 [(google.api.field_behavior) = REQUIRED];
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  string new_name = 4 [(google.api.field_behavior) = REQUIRED];
  string cluster = 5;
}

message ModifyColumnRequest {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string table = 2 [(google.api.field_behavior) = REQUIRED];
  Column column = 3 [(google.api.field_behavior) = REQUIRED];
  string cluster = 4;
}

message QueryRow {
  repeated string values = 1;
}

message ExecuteQueryRequest {
  string query = 1 [(google.api.field_behavior) = REQUIRED];
  uint32 max_rows = 2;
  string database = 3;
}

message ExecuteQueryResponse {
  repeated string columns = 1;
  repeated string types = 2;
  repeated QueryRow rows = 3;
  uint64 total_rows = 4;
  double elapsed_seconds = 5;
  uint64 bytes_read = 6;
  uint64 rows_read = 7;
}

message PreviewTableDataRequest {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string table = 2 [(google.api.field_behavior) = REQUIRED];
  uint32 limit = 3;
  uint32 offset = 4;
  string order_by = 5;
  string where = 6;
}

message TablePart {
  string partition = 1;
  string name = 2;
  bool active = 3;
  uint64 rows = 4;
  uint64 bytes_on_disk = 5;
  uint64 data_uncompressed_bytes = 6;
  google.protobuf.Timestamp modification_time = 7;
  string disk_name = 8;
  string min_date = 9;
  string max_date = 10;
}

message ListPartsRequest {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string table = 2 [(google.api.field_behavior) = REQUIRED];
  bool active_only = 3;
}

message PartsList {
  repeated TablePart items = 1;
}

message DropPartitionRequest {
  string database = 1 [(google.api.field_behavior) = REQUIRED];
  string table = 2 [(google.api.field_behavior) = REQUIRED];
  string partition = 3 [(google.api.field_behavior) = REQUIRED];
  bool detach = 4;
  string cluster = 5;
}

message ProcessInfo {
  string query_id = 1;
  string user = 2;
  double elapsed_seconds = 3;
  uint64 rows_read = 4;
  uint64 bytes_read = 5;
  uint64 memory_usage = 6;
  string query = 7;
  string client_name = 8;
  string os_user = 9;
  bool is_cancelled = 10;
}

message ListProcessesRequest {}

message ProcessList {
  repeated ProcessInfo items = 1;
}

message KillProcessRequest {
  string query_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message DiskInfo {
  string name = 1;
  string path = 2;
  uint64 free_space = 3;
  uint64 total_space = 4;
  uint64 unreserved_space = 5;
  string type = 6;
}

message ListDisksRequest {}

message DiskList {
  repeated DiskInfo items = 1;
}

message MetricItem {
  string name = 1;
  double value = 2;
  string description = 3;
}

message GetMetricsRequest {}

message MetricsResponse {
  repeated MetricItem metrics = 1;
  repeated MetricItem async_metrics = 2;
}

message TableOptionsRequest {}

message TableOptionsResponse {
  repeated string engines = 1;
  repeated string data_types = 2;
  repeated string merge_tree_settings = 3;
  repeated string codecs = 4;
}
