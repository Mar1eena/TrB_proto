syntax = "proto3";

package trb.instruments.v1;

option go_package = "github.com/Mar1eena/trb_proto/gen/go/instruments;instruments";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "api/tinvest/instruments.proto";

// Instruments — каталог инструментов в ClickHouse (TrB.sht) и синхронизация с invest.
service Instruments {
  rpc ListInstruments(ListInstrumentsRequest) returns (ListInstrumentsResponse) {
    option (google.api.http) = {
      get: "/v1/instruments"
      additional_bindings { post: "/ListInstruments" body: "*" }
    };
  }

  // ListInstrumentVersions — история версий одного инструмента из TrB.sht (без FINAL).
  rpc ListInstrumentVersions(ListInstrumentVersionsRequest) returns (ListInstrumentVersionsResponse) {
    option (google.api.http) = {
      get: "/v1/instruments/{uid}/versions"
      additional_bindings { post: "/ListInstrumentVersions" body: "*" }
    };
  }

  // UpsertInstruments сохраняет акции в TrB.sht.
  // При изменении реквизитов версия (дата) сдвигается на сегодня, строка становится актуальной.
  rpc UpsertInstruments(tinkoff.public.invest.api.contract.v1.SharesResponse) returns (UpsertInstrumentsResponse) {
    option (google.api.http) = {
      post: "/v1/instruments/upsert"
      body: "*"
      additional_bindings { post: "/UpsertInstruments" body: "*" }
    };
  }

  // SyncInstruments запрашивает акции у invest и вызывает UpsertInstruments.
  rpc SyncInstruments(SyncInstrumentsRequest) returns (SyncInstrumentsResponse) {
    option (google.api.http) = {
      post: "/v1/instruments/sync"
      body: "*"
      additional_bindings { post: "/SyncInstruments" body: "*" }
    };
  }
}

message ListFilter {
  string q = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListInstrumentsRequest {
  ListFilter filter = 1;
  // lite=true — только uid/figi/ticker/name (каталог планировщика).
  bool lite = 2;
}

message InstrumentListItem {
  tinkoff.public.invest.api.contract.v1.Share share = 1;
  google.protobuf.Timestamp version = 2;
  // Число версий в TrB.sht (без FINAL), uniqExact(version).
  int32 version_count = 3;
}

message ListInstrumentsResponse {
  repeated InstrumentListItem items = 1;
}

message ListInstrumentVersionsRequest {
  string uid = 1;
}

message InstrumentVersion {
  tinkoff.public.invest.api.contract.v1.Share share = 1;
  google.protobuf.Timestamp version = 2;
}

message ListInstrumentVersionsResponse {
  repeated InstrumentVersion items = 1;
}

message UpsertInstrumentsResponse {
  int32 fetched = 1;
  int32 inserted = 2;
  int32 updated = 3;
  int32 unchanged = 4;
}

message SyncInstrumentsRequest {}

message SyncInstrumentsResponse {
  UpsertInstrumentsResponse upsert = 1;
}
