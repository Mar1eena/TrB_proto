syntax = "proto3";

package trb.strategysearch.v1;

option go_package = "github.com/Mar1eena/trb_proto/gen/go/strategysearch;strategysearch";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "strategysearch/spec.proto";
import "strategysearch/backtest.proto";
import "strategysearch/search.proto";

// StrategySearchService — автопоиск стратегий на Optuna поверх backtrader/TA-Lib,
// метрики QuantStats, данные из ClickHouse. Самостоятельный сервис: не зависит
// от каталога стратегий (trb.strategy.v1) — принимает и возвращает спек стратегии
// инлайн (StrategySearchSpec).
// REST-биндинги: ресурсный путь /v1/strategysearch/* плюс RPC-фолбэк
// additional_bindings { post: "/RpcName" }.
service StrategySearchService {
  rpc SubmitSearch(SubmitSearchRequest) returns (SubmitSearchResponse) {
    option (google.api.http) = {
      post: "/v1/strategysearch/searches"
      body: "*"
      additional_bindings { post: "/SubmitSearch" body: "*" }
    };
  }
  rpc GetSearchProgress(GetSearchProgressRequest) returns (SearchRun) {
    option (google.api.http) = {
      get: "/v1/strategysearch/searches/{search_id}"
      additional_bindings { post: "/GetSearchProgress" body: "*" }
    };
  }
  rpc GetBestTrials(GetBestTrialsRequest) returns (GetBestTrialsResponse) {
    option (google.api.http) = {
      get: "/v1/strategysearch/searches/{search_id}/best"
      additional_bindings { post: "/GetBestTrials" body: "*" }
    };
  }
  // Все трайлы поиска (любой state), по возрастанию trial_number — источник
  // для графиков истории оптимизации/parallel coordinate/slice (в отличие от
  // GetBestTrials, который отдаёт только complete-трайлы).
  rpc ListSearchTrials(ListSearchTrialsRequest) returns (ListSearchTrialsResponse) {
    option (google.api.http) = {
      get: "/v1/strategysearch/searches/{search_id}/trials"
      additional_bindings { post: "/ListSearchTrials" body: "*" }
    };
  }
  // Важность параметров поиска (optuna fANOVA), считается по требованию через
  // реконструкцию Study из RDB-хранилища — см. ParamImportance в search.proto.
  rpc GetParamImportances(GetParamImportancesRequest) returns (GetParamImportancesResponse) {
    option (google.api.http) = {
      get: "/v1/strategysearch/searches/{search_id}/importances"
      additional_bindings { post: "/GetParamImportances" body: "*" }
    };
  }
  rpc ListSearches(ListSearchesRequest) returns (ListSearchesResponse) {
    option (google.api.http) = {
      get: "/v1/strategysearch/searches"
      additional_bindings { post: "/ListSearches" body: "*" }
    };
  }
  rpc CancelSearch(CancelSearchRequest) returns (SearchRun) {
    option (google.api.http) = {
      post: "/v1/strategysearch/searches/{search_id}:cancel"
      additional_bindings { post: "/CancelSearch" body: "*" }
    };
  }

  // --- сохранённые настройки поиска (пресеты формы) ---
  rpc CreateSearchPreset(CreateSearchPresetRequest) returns (SearchPreset) {
    option (google.api.http) = {
      post: "/v1/strategysearch/presets"
      body: "*"
      additional_bindings { post: "/CreateSearchPreset" body: "*" }
    };
  }
  rpc ListSearchPresets(ListSearchPresetsRequest) returns (ListSearchPresetsResponse) {
    option (google.api.http) = {
      get: "/v1/strategysearch/presets"
      additional_bindings { post: "/ListSearchPresets" body: "*" }
    };
  }
  rpc DeleteSearchPreset(DeleteSearchPresetRequest) returns (DeleteSearchPresetResponse) {
    option (google.api.http) = {
      delete: "/v1/strategysearch/presets/{id}"
      additional_bindings { post: "/DeleteSearchPreset" body: "*" }
    };
  }
}

message SubmitSearchRequest {
  string name = 1;
  StrategySearchSpec base_spec = 2;    // фиксированная часть спека + стартовые значения
  repeated ParamRange search_space = 3;
  StudyConfig study = 4;
  BacktestConfig config = 5;
  // template задан => структура стратегии (индикаторы/условия) тоже часть
  // поиска, base_spec даёт только sizing/risk/warmup_bars (см. search.proto).
  StrategyTemplate template = 6;
  // market_space задан => manage резолвит config.uid/interval в
  // market_candidates запросом к HistoricCandle/Instruments и uid/interval/
  // период тоже становятся частью поиска; config.uid/interval/start/end
  // в этом случае — не обязательны (игнорируются координатором).
  MarketSpace market_space = 7;
}

message SubmitSearchResponse {
  string search_id = 1;
  RunStatus status = 2;
}

message GetSearchProgressRequest {
  string search_id = 1;
}

message GetBestTrialsRequest {
  string search_id = 1;
  int32 top_k = 2;  // 0 => 10; при is_multi_objective игнорируется — возвращается весь фронт Парето
}

message GetBestTrialsResponse {
  repeated Trial items = 1;
}

message ListSearchTrialsRequest {
  string search_id = 1;
  int32 limit = 2;   // 0 => 200
  int32 offset = 3;
}

message ListSearchTrialsResponse {
  repeated Trial items = 1;
  int32 total = 2;
}

message GetParamImportancesRequest {
  string search_id = 1;
  // По какой цели считать при многоцелевом поиске (ObjectiveMetric.metric);
  // пусто => первая метрика study.objective.metrics.
  string metric = 2;
}

message GetParamImportancesResponse {
  repeated ParamImportance items = 1;
}

message ListSearchesRequest {
  RunStatus status = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListSearchesResponse {
  repeated SearchRun items = 1;
  int32 total = 2;
}

message CancelSearchRequest {
  string search_id = 1;
}

// --- пресеты формы поиска ---
// Именованный снимок настроек формы (base_spec/search_space/study/config) —
// чтобы не заполнять её каждый раз заново. Не запускает поиск сам по себе;
// для запуска нужно скопировать значения в SubmitSearchRequest.
// Изменить пресет = удалить и создать заново под тем же именем — отдельного
// Update/Get-по-id не вводим, при ожидаемых единицах-десятках пресетов
// ListSearchPresets отдаёт полные объекты.

message SearchPreset {
  string id = 1;
  string name = 2;
  StrategySearchSpec base_spec = 3;
  repeated ParamRange search_space = 4;
  StudyConfig study = 5;
  BacktestConfig config = 6;
  google.protobuf.Timestamp created_at = 7;
  // Снимок структурного/рыночного поиска (см. SearchRun.template/market_space
  // в search.proto) — market_candidates намеренно не хранится в пресете:
  // это резолв на момент SubmitSearch, а не часть конфигурации формы.
  StrategyTemplate template = 8;
  MarketSpace market_space = 9;
}

message CreateSearchPresetRequest {
  string name = 1;
  StrategySearchSpec base_spec = 2;
  repeated ParamRange search_space = 3;
  StudyConfig study = 4;
  BacktestConfig config = 5;
  StrategyTemplate template = 6;
  MarketSpace market_space = 7;
}

message ListSearchPresetsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListSearchPresetsResponse {
  repeated SearchPreset items = 1;
  int32 total = 2;
}

message DeleteSearchPresetRequest {
  string id = 1;
}

message DeleteSearchPresetResponse {
  string id = 1;
}
