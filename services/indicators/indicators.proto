syntax = "proto3";

package trb.indicators.v1;

option go_package = "github.com/Mar1eena/trb_proto/gen/go/indicators;indicators";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Indicators — расчёт технических индикаторов по OHLCV-свечам (TA-Lib).
service Indicators {
  // Compute считает индикатор по переданным свечам (от старых к новым).
  rpc Compute(ComputeRequest) returns (ComputeResponse) {
    option (google.api.http) = {
      post: "/v1/indicators/compute"
      body: "*"
      additional_bindings { post: "/Compute" body: "*" }
    };
  }

  // ListSupported возвращает список поддерживаемых индикаторов и параметров по умолчанию.
  rpc ListSupported(ListSupportedRequest) returns (ListSupportedResponse) {
    option (google.api.http) = {
      get: "/v1/indicators/supported"
      additional_bindings { post: "/ListSupported" body: "*" }
    };
  }
}

enum IndicatorType {
  INDICATOR_TYPE_UNSPECIFIED = 0;
  INDICATOR_TYPE_RSI = 1;
  INDICATOR_TYPE_SMA = 2;
  INDICATOR_TYPE_EMA = 3;
  INDICATOR_TYPE_MACD = 4;
  INDICATOR_TYPE_BB = 5;
}

message Candle {
  google.protobuf.Timestamp time = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double volume = 6;
}

message ComputeRequest {
  IndicatorType type = 1;
  // Свечи в хронологическом порядке (ASC). Минимум зависит от индикатора и params.
  repeated Candle candles = 2;
  // Параметры индикатора: period, fastperiod, slowperiod, signalperiod, nbdevup, nbdevdn.
  map<string, double> params = 3;
}

message IndicatorPoint {
  google.protobuf.Timestamp time = 1;
  // Ключи: value, signal, hist, upper, middle, lower — в зависимости от индикатора.
  map<string, double> values = 2;
}

message ComputeResponse {
  IndicatorType type = 1;
  map<string, double> params = 2;
  repeated IndicatorPoint points = 3;
}

message IndicatorInfo {
  IndicatorType type = 1;
  string name = 2;
  int32 min_bars = 3;
  map<string, double> default_params = 4;
}

message ListSupportedRequest {}

message ListSupportedResponse {
  repeated IndicatorInfo indicators = 1;
}
