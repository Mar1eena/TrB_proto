syntax = "proto3";

package trb.indicators.v1;

option go_package = "github.com/Mar1eena/trb_proto/gen/go/indicators;indicators";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "indicators/params.proto";

// Settings — хранение настроек индикаторов (TrB.indicator_settings).
// HTTP-методы различают операции на одном ресурсе /v1/indicators/settings.
service Indicator_Settings {
  // GetSettings возвращает сохранённые настройки (по hash и/или uid+interval).
  rpc GetSettingsHash(Settings) returns (SettingsHash) {
    option (google.api.http) = {
      get: "/v1/indicators/settings"
      additional_bindings { post: "/GetSettings" body: "*" }
    };
  }

  // UpdateSettings upsert настроек по uid+interval+params; в ответе — актуальный hash.
  rpc UpdateSettings(Settings) returns (UpdateSettingsResponse) {
    option (google.api.http) = {
      put: "/v1/indicators/settings"
      body: "*"
      additional_bindings { post: "/UpdateSettings" body: "*" }
    };
  }

  // DeleteSettings удаляет настройки по hash.
  rpc DeleteSettings(Settings) returns (DeleteSettingsResponse) {
    option (google.api.http) = {
      delete: "/v1/indicators/settings"
      additional_bindings { post: "/DeleteSettings" body: "*" }
    };
  }
}

message Settings {
    uint32 interval = 1;
    string uid = 2;
    IndicatorSettings settings = 3;
    google.protobuf.Timestamp start = 4;
    google.protobuf.Timestamp end = 5;
}

message SettingsHash{
    uint64 hash = 1;
}

message DeleteSettingsResponse {
    uint64 hash = 1;
    bool delete = 2;
}

message UpdateSettingsResponse {
    uint64 hash = 1;
    bool update = 2;
}
