syntax = "proto3";

package trb.indicators.v1;

option go_package = "github.com/Mar1eena/trb_proto/gen/go/indicators;indicators";

// Optional-параметры функций TA-Lib (https://ta-lib.org/functions/).
// Сообщения без полей — у функции нет optIn*; вариант oneof всё равно задаёт тип.

// Тип скользящей средней (значения совпадают с TA_MAType).
enum MAType {
  MA_TYPE_SMA = 0;
  MA_TYPE_EMA = 1;
  MA_TYPE_WMA = 2;
  MA_TYPE_DEMA = 3;
  MA_TYPE_TEMA = 4;
  MA_TYPE_TRIMA = 5;
  MA_TYPE_KAMA = 6;
  MA_TYPE_MAMA = 7;
  MA_TYPE_T3 = 8;
}

// ---------------------------------------------------------------------------
// Cycle Indicators
// ---------------------------------------------------------------------------

// HT_DCPERIOD — Hilbert Transform - Dominant Cycle Period.
message HtDcPeriodParams {}

// HT_DCPHASE — Hilbert Transform - Dominant Cycle Phase.
message HtDcPhaseParams {}

// HT_PHASOR — Hilbert Transform - Phasor Components.
message HtPhasorParams {}

// HT_SINE — Hilbert Transform - SineWave.
message HtSineParams {}

// HT_TRENDMODE — Hilbert Transform - Trend vs Cycle Mode.
message HtTrendModeParams {}

// ---------------------------------------------------------------------------
// Math Operators
// ---------------------------------------------------------------------------

// ADD — Vector Arithmetic Add.
message AddParams {}

// DIV — Vector Arithmetic Div.
message DivParams {}

// MAX — Highest value over a specified period.
message MaxParams {
  uint32 period = 1;
}

// MAXINDEX — Index of highest value over a specified period.
message MaxIndexParams {
  uint32 period = 1;
}

// MIN — Lowest value over a specified period.
message MinParams {
  uint32 period = 1;
}

// MININDEX — Index of lowest value over a specified period.
message MinIndexParams {
  uint32 period = 1;
}

// MINMAX — Lowest and highest values over a specified period.
message MinMaxParams {
  uint32 period = 1;
}

// MINMAXINDEX — Indexes of lowest and highest values over a specified period.
message MinMaxIndexParams {
  uint32 period = 1;
}

// MULT — Vector Arithmetic Mult.
message MultParams {}

// SUB — Vector Arithmetic Subtraction.
message SubParams {}

// SUM — Summation.
message SumParams {
  uint32 period = 1;
}

// ---------------------------------------------------------------------------
// Math Transform
// ---------------------------------------------------------------------------

// ACOS — Vector Trigonometric ACos.
message AcosParams {}

// ASIN — Vector Trigonometric ASin.
message AsinParams {}

// ATAN — Vector Trigonometric ATan.
message AtanParams {}

// CEIL — Vector Ceil.
message CeilParams {}

// COS — Vector Trigonometric Cos.
message CosParams {}

// COSH — Vector Trigonometric Cosh.
message CoshParams {}

// EXP — Vector Arithmetic Exp.
message ExpParams {}

// FLOOR — Vector Floor.
message FloorParams {}

// LN — Vector Log Natural.
message LnParams {}

// LOG10 — Vector Log10.
message Log10Params {}

