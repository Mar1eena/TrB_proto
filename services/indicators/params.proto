message SinParams {}

// SINH — Vector Trigonometric Sinh.
message SinhParams {}

// SQRT — Vector Square Root.
message SqrtParams {}

// TAN — Vector Trigonometric Tan.
message TanParams {}

// TANH — Vector Trigonometric Tanh.
message TanhParams {}

