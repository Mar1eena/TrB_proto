syntax = "proto3";

package trb.indicators.v1;

option go_package = "github.com/Mar1eena/trb_proto/gen/go/indicators;indicators";

import "google/protobuf/timestamp.proto";

// Выходы функций TA-Lib (https://ta-lib.org/functions/).
// Форма точки совпадает с out* массивами C API; вариант oneof = функция.
// Номера полей совпадают с IndicatorSettings.

message RealPoint {
  google.protobuf.Timestamp time = 1;
  double value = 2;
}

message RealSeries {
  repeated RealPoint points = 1;
}

message IntegerPoint {
  google.protobuf.Timestamp time = 1;
  int32 value = 2;
}

message IntegerSeries {
  repeated IntegerPoint points = 1;
}

message AroonPoint {
  google.protobuf.Timestamp time = 1;
  double down = 2;
  double up = 3;
}

message AroonSeries {
  repeated AroonPoint points = 1;
}

message BandsPoint {
  google.protobuf.Timestamp time = 1;
  double upper = 2;
  double middle = 3;
  double lower = 4;
}

message BandsSeries {
  repeated BandsPoint points = 1;
}

message MacdPoint {
  google.protobuf.Timestamp time = 1;
  double macd = 2;
  double signal = 3;
  double hist = 4;
}

message MacdSeries {
  repeated MacdPoint points = 1;
}

message MamaPoint {
  google.protobuf.Timestamp time = 1;
  double mama = 2;
  double fama = 3;
}

message MamaSeries {
  repeated MamaPoint points = 1;
}

message HtPhasorPoint {
  google.protobuf.Timestamp time = 1;
  double in_phase = 2;
  double quadrature = 3;
}

message HtPhasorSeries {
  repeated HtPhasorPoint points = 1;
}

message HtSinePoint {
  google.protobuf.Timestamp time = 1;
  double sine = 2;
  double lead_sine = 3;
}

message HtSineSeries {
  repeated HtSinePoint points = 1;
}

message StochPoint {
  google.protobuf.Timestamp time = 1;
  double slow_k = 2;
  double slow_d = 3;
}

message StochSeries {
  repeated StochPoint points = 1;
}

message StochFPoint {
  google.protobuf.Timestamp time = 1;
  double fast_k = 2;
  double fast_d = 3;
}

message StochFSeries {
  repeated StochFPoint points = 1;
}

message MinMaxPoint {
  google.protobuf.Timestamp time = 1;
  double min = 2;
  double max = 3;
}

message MinMaxSeries {
  repeated MinMaxPoint points = 1;
}

message MinMaxIndexPoint {
  google.protobuf.Timestamp time = 1;
  int32 min_index = 2;
  int32 max_index = 3;
}

message MinMaxIndexSeries {
  repeated MinMaxIndexPoint points = 1;
}

// Значения индикатора: вариант oneof совпадает с IndicatorSettings.
