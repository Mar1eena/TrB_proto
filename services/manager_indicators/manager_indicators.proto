syntax = "proto3";

package manager_indicators;

option go_package = "github.com/Mar1eena/trb_proto/gen/go/manager_indicators;manager_indicators";

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

service manager_indicators {
    rpc updated_indicator (IndicatorUpdateRequest) returns (IndicatorUpdateResponse) {
        option (google.api.http) = {
            post: "/Update"
            body: "*"
        };
    }
}

message IndicatorUpdateRequest {
    repeated indicators indicators_list = 1 [(google.api.field_behavior) = REQUIRED];
    bool is_update = 2;
}

message IndicatorUpdateResponse {
    bool success = 1;
    string message = 2;
}

